  <style>
    ::root {
      --primary-color: #ff6b6b;
      --secondary-color: #4ecdc4;
      --text-color: #333;
      --background-color: #f9f9f9;
      --line-height: 1.2;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 0 auto;
    }

    #our-team {
      background-image: url("https://images.unsplash.com/photo-1638466248266-ff282cb2e6a9?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D");
      background-size: cover;
      background-position: center;
      padding: 50px 0;
    }

    .heading-wraper {
      text-align: center;
      color: #fff;
    }

    .heading-wraper h4 {
      font-size: 12px;
      line-height: var(--line-height);
      font-weight: 500;
    }

    .heading-wraper h2 {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 60px;
    }

    .team-member h3 {
      color: #fff;
    }

    .team-member p {
      color: #fff;
    }

    .social-media-wraper a {
      text-decoration: none;
    }

    .team-member {
      width: calc(25% - 20px);
      height: 350px;
      position: relative;
    }

    .team-member img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 30px;
    }

    .headingandsocial-media-wraper {
      display: flex;
      flex-direction: column;
      position: absolute;
      bottom: 20px;
      left: 30%;
      transform: translateX(-50%);
      gap: 10px;
      z-index: 99;
    }

    .team-sub-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      gap: 5px;

    }

    .heading-item h3 {
      font-size: 18px;
      line-height: var(--line-height);
      font-weight: 600;
      margin-bottom: 5px;
    }

    .heading-item p {
      line-height: var(--line-height);
      font-size: 12px;
      font-weight: 400;
    }

    .team-icon {
      position: relative;
      display: inline-block;
      width: 25px;
      height: 25px;
      background: #111111;
      font-size: 12px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background-color 0.3s ease;
    }

    .social-media-wraper {
      display: flex;
      gap: 5px;

    }

    .team-icon i {
      font-size: 10px;
    }


    .shadow {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0) 66%, rgb(0 0 0) 100%);
      z-index: 10;
      top: 0;
      left: 0;
      border-radius: 30px;

    }

    .team-member {
      position: relative;
      overflow: hidden;
    }


    .team-member .shadow:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0) 66%, rgb(218, 78, 13) 100%);
      transition: 0.5s;

    }

    .team-card {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
  </style>
